name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The oldest supported runner, so the binary runs on older glibc too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build daemon
        run: cargo build --locked --release
        working-directory: daemon
      - name: Package
        run: |
          name="notchline-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$name"
          cp daemon/target/release/notchline README.md LICENSE config.example.toml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd extension && zip -r ../dist/notchline@soefyan45.github.io.shell-extension.zip \
            metadata.json *.js stylesheet.css icons)
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
