[package]
name = "notchline"
version = "0.1.0"
edition = "2024"
description = "Notch-style notification layer for GNOME"
license = "GPL-2.0-or-later"
repository = "https://github.com/soefyan45/notchline"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.8"
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "service"] }
