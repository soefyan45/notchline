# Notchline config — copy to ~/.config/notchline/config.toml
# Apply changes with: notchline reload
# Every key is optional; missing keys fall back to these defaults.

[pill]
# Keep a small notch visible when there is no notification
idle_visible = true
# Hide the idle notch and reveal it when the pointer hits the top center edge
# (overrides idle_visible while idle)
reveal_on_hover = true
# Open the notch in full by resting the pointer on it ("hover") or by clicking it ("click")
open_on = "hover"
# Close the opened notch this many milliseconds after the pointer leaves it;
# 0 keeps it open until you click elsewhere
auto_close_ms = 0
# "menyatu" grows out of the top edge with concave corners,
# "pulau" floats below it as a separate pill (uses top_offset)
style = "menyatu"
# Colors of the notch, the panel and the preferences window:
# "default" (black, teal accent) or "te" (graphite, orange accent)
theme = "default"
# Notch size while idle (logical pixels); compact lines grow from this width
idle_width = 200
idle_height = 32
# Width and minimum height of a notification opened in full (logical pixels)
expanded_width = 420
expanded_height = 72
# Width of the full panel opened by hovering or pulling the notch
panel_width = 840
# Gap between the top of the screen and the notch (style = "pulau" only)
top_offset = 4
# Corner radius, clamped to half the height
radius = 20
# Background color (#rrggbb) and its opacity (0.0 - 1.0)
background = "#000000"
opacity = 0.95
# Expand/collapse animation duration
animation_ms = 280

[behavior]
# Default display time per notification
timeout_ms = 4000
# Suppress GNOME's own notification banners
hide_gnome_banners = true
# Show GNOME system notifications (notify-send, apps) in the notch
capture_system = true
# Notchline icon in the top bar, with a menu to open the panel, pause and settings
show_indicator = true

[system]
# Show the battery level for 3 seconds when a charger is plugged in
charging_notice = true
# Remind of calendar events shortly before they start
meeting_reminder = true
meeting_minutes = 1
# Default length of a focus timer (top bar menu, or `notchline focus`)
focus_minutes = 25

[agent]
# Coding agents (Claude Code) shown in the notch; set up with `notchline install-hooks claude`
enabled = true
# Show the agent's todo list as steps, e.g. 4/7
show_progress = true
# Open the notch on the agents tab when an agent asks for permission
permission_requests = true
# Flash the notch for 4 seconds when an agent finishes
notify_done = true
# Offer "allow once" in the notch, only for safe_commands below
allow_from_notch = true
# Seconds a permission request waits in the notch before the terminal asks instead
permission_timeout_s = 60
# Bash commands that may be allowed from the notch: exact, or followed by arguments.
# Commands with ; & | ` $( > <, sudo, rm -rf, git push or curl always go to the terminal.
safe_commands = ["npm test", "bun run lint", "git status", "git diff", "git log"]

[drop]
# Liquid drop that reaches for the pointer near the top center (logical pixels)
enabled = true
# Distance below the notch at which the drop starts reaching for the pointer
pull_range = 80.0
# Deepest the drop reaches
max_depth = 22.0
# Width range of the drop
min_width = 5.0
max_width = 11.0
# How softly the drop blends into the notch
blend = 6.0

[spring]
# Springs behind every movement, tuned for animation_ms = 280.
# Higher stiffness is snappier; lower damping wobbles more.
width_stiffness = 170.0
width_damping = 15.0
height_stiffness = 320.0
height_damping = 22.0
drop_stiffness = 520.0
drop_damping = 20.0
drop_x_stiffness = 600.0
drop_x_damping = 45.0
